# Redireccion canónica para celparts.pe (sin www + HTTPS)
# Ajusta rutas de certificados y upstream segun tu servidor.

server {
    listen 80;
    listen [::]:80;
    server_name celparts.pe www.celparts.pe;

    return 301 https://celparts.pe$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.celparts.pe;

    ssl_certificate /etc/letsencrypt/live/celparts.pe/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/celparts.pe/privkey.pem;

    return 301 https://celparts.pe$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name celparts.pe;

    ssl_certificate /etc/letsencrypt/live/celparts.pe/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/celparts.pe/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    location / {
        proxy_pass http://127.0.0.1:3018;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
